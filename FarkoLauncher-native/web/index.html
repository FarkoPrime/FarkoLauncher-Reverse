<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farko Launcher</title>
  <link rel="stylesheet" href="css/style.css?v=100" />
</head>
<body>
  <div class="app view-play is-loading">
    <header class="topbar">
      <div class="topbar-drag" aria-hidden="true"></div>
      <nav class="tabs">
        <button class="tab active" data-page="play">GTA 5</button>
        <button class="tab" data-page="favourites">Favourites</button>
        <button class="tab" data-page="history">History</button>
        <button class="tab tab-external" data-page="site">Site</button>
      </nav>
      <div class="logo-mark" aria-hidden="true">
        <img src="img/logo-f.png?v=15" alt="Farko Launcher" width="36" height="36" />
      </div>
      <div class="topbar-right">
        <button class="icon-btn icon-btn-discord" id="btnDiscord" title="Discord" aria-label="Join Discord">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        </button>
        <button class="icon-btn" id="btnRefresh" title="Refresh master list" aria-label="Refresh master list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn icon-btn-direct" id="btnDirect" title="Direct connect" aria-label="Direct connect">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4v9"/>
            <path d="m8.5 9.5 3.5 3.5 3.5-3.5"/>
            <path d="M5 19h14"/>
          </svg>
        </button>
        <span class="topbar-sep" aria-hidden="true"></span>
        <button class="icon-btn" id="btnMin" aria-label="Minimize">
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
        </button>
        <span class="icon-btn icon-btn-max" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="8"/></svg>
        </span>
        <button class="icon-btn btn-close-x" id="btnClose" aria-label="Close" style="color: #ffffff !important; opacity: 1 !important;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <div class="hero" id="heroBanner" aria-hidden="false"></div>

    <main class="main">
      <section class="page page-list active" id="pageList">
        <div class="table-panel">
          <div class="table-head">
            <div class="th-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="search" placeholder="Search" autocomplete="off" spellcheck="false" />
              <span class="server-count" aria-live="polite">
                <span id="serverCount" class="server-count-num">0</span>
                <span class="server-count-label">SERVERS</span>
              </span>
            </div>
            <div class="th-col icons" aria-hidden="true"></div>
            <div class="th-col mode">GAMEMODE</div>
            <div class="th-col ping">PING</div>
          </div>
          <div class="table-body" id="serverList"></div>
          <div id="playToast" class="play-toast" hidden></div>
        </div>
      </section>
    </main>

    <div id="directModal" class="direct-overlay" hidden>
      <div class="direct-modal" role="dialog" aria-labelledby="directModalTitle">
        <div class="direct-modal-head" id="directModalTitle">Direct connect</div>
        <form class="direct-modal-body" id="directForm">
          <input type="text" id="directHost" placeholder="IP" spellcheck="false" autocomplete="off" />
          <span class="direct-sep" aria-hidden="true">:</span>
          <input type="text" id="directPort" placeholder="PORT" spellcheck="false" autocomplete="off" inputmode="numeric" />
          <button type="submit" class="direct-connect-btn" id="btnDirectConnect">CONNECT</button>
        </form>
      </div>
    </div>

    <div id="ctxMenu" class="ctx-menu" hidden></div>

    <div id="serverLoading" class="server-loading" aria-busy="true" aria-label="Loading servers">
      <div class="server-loading-spinner" aria-hidden="true"></div>
    </div>

    <footer class="statusbar">
      <div class="status-left">
        <span class="status-led" id="statusDot"></span>
        <span id="statusText">Ready</span>
      </div>
      <div class="status-right">
        <button class="btn-connect sm" id="btnSidebarConnect" disabled>Connect</button>
      </div>
    </footer>
  </div>
  <script src="js/app.js?v=71"></script>
</body>
</html>
